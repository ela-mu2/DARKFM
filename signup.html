<!DOCTYPE html>
<html>
  <head>
    <title>DARKFM - Signup</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.2/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container my-5 mx-auto" style="max-width: 500px;">
      <h1 class="h1 mb-4 text-center">Sign Up a New Account</h1>

      <div class="card p-4" style="background: rgba(255,255,255,0.02)">
        <form method="GET" action="dashboard.html">
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control text-white" id="name" name="name" style="background: rgba(255,255,255,0.02)"/>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control text-white" id="email" name="email" style="background: rgba(255,255,255,0.02)"/>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control text-white"
              id="password"
              name="password"
              style="background: rgba(255,255,255,0.02)"
            />
          </div>
          <div class="mb-3">
            <label for="confirm_password" class="form-label"
              >Confirm Password</label
            >
            <input
              type="password"
              class="form-control text-white"
              id="confirm_password"
              name="confirm_password"
              style="background: rgba(255,255,255,0.02)"
            />
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-outline-info mt-2 text-white-custom" style="border-color: var(--accent); color: var(--accent) !important;">
              Sign Up
            </button>
          </div>
        </form>
      </div>

      <!-- links -->
      <div
        class="d-flex justify-content-between align-items-center gap-3 mx-auto pt-3"
      >
        <a href="index.html" class="text-decoration-none small"
          ><i class="bi bi-arrow-left-circle"></i> Go back</a
        >
        <a href="login.html" class="text-decoration-none small"
          >Already have an account? Login here
          <i class="bi bi-arrow-right-circle"></i
        ></a>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
