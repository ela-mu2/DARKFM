<!DOCTYPE html>
<html>
  <head>
    <title>DARKFM - Manage Schedule</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.2/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container mx-auto my-5" style="max-width: 700px;">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h1 class="h1">Manage Schedule</h1>
        <div class="text-end">
          <a href="manage-posts-add.html" class="btn btn-accent btn-sm text-white-custom"
            >Add New Post</a
          >
        </div>
      </div>
      <div class="card mb-2 p-4 card-custom">
        <table class="table text-white">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col" style="width: 40%;">Title</th>
              <th scope="col">Status</th>
              <th scope="col" class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row">5</th>
              <td>Schedule 5</td>
              <td><span class="badge text-warning">Pending Review</span></td>
              <td class="text-end">
                <div class="buttons">
                  <a
                    href="post.html"
                    target="_blank"
                    class="btn btn-outline-info btn-sm me-2 disabled"
                    ><i class="bi bi-eye"></i
                  ></a>
                  <a
                    href="manage-posts-edit.html"
                    class="btn btn-outline-secondary btn-sm me-2"
                    ><i class="bi bi-pencil"></i
                  ></a>
                  <a href="#" class="btn btn-outline-danger btn-sm"
                    ><i class="bi bi-trash"></i
                  ></a>
                </div>
              </td>
            </tr>
            <tr>
              <th scope="row">4</th>
              <td>Schedule 4</td>
              <td><span class="badge text-success">Publish</span></td>
              <td class="text-end">
                <div class="buttons">
                  <a
                    href="post.html"
                    target="_blank"
                    class="btn btn-outline-info btn-sm me-2 disabled"
                    ><i class="bi bi-eye"></i
                  ></a>
                  <a
                    href="manage-posts-edit.html"
                    class="btn btn-outline-secondary btn-sm me-2"
                    ><i class="bi bi-pencil"></i
                  ></a>
                  <a href="#" class="btn btn-outline-danger btn-sm"
                    ><i class="bi bi-trash"></i
                  ></a>
                </div>
              </td>
            </tr>
            <tr>
              <th scope="row">3</th>
              <td>Schedule 3</td>
              <td><span class="badge text-success">Publish</span></td>
              <td class="text-end">
                <div class="buttons">
                  <a
                    href="post.html"
                    target="_blank"
                    class="btn btn-outline-info btn-sm me-2 disabled"
                    ><i class="bi bi-eye"></i
                  ></a>
                  <a
                    href="manage-posts-edit.html"
                    class="btn btn-outline-secondary btn-sm me-2"
                    ><i class="bi bi-pencil"></i
                  ></a>
                  <a href="#" class="btn btn-outline-danger btn-sm"
                    ><i class="bi bi-trash"></i
                  ></a>
                </div>
              </td>
            </tr>
            <tr>
              <th scope="row">2</th>
              <td>Schedule 2</td>
              <td><span class="badge text-success">Publish</span></td>
              <td class="text-end">
                <div class="buttons">
                  <a
                    href="post.html"
                    target="_blank"
                    class="btn btn-outline-info btn-sm me-2 disabled"
                    ><i class="bi bi-eye"></i
                  ></a>
                  <a
                    href="manage-posts-edit.html"
                    class="btn btn-outline-secondary btn-sm me-2"
                    ><i class="bi bi-pencil"></i
                  ></a>
                  <a href="#" class="btn btn-outline-danger btn-sm"
                    ><i class="bi bi-trash"></i
                  ></a>
                </div>
              </td>
            </tr>
            <tr>
              <th scope="row">1</th>
              <td>Schedule 1</td>
              <td><span class="badge text-success">Publish</span></td>
              <td class="text-end">
                <div class="buttons">
                  <a
                    href="post.html"
                    target="_blank"
                    class="btn btn-outline-info btn-sm me-2 disabled"
                    ><i class="bi bi-eye"></i
                  ></a>
                  <a
                    href="manage-posts-edit.html"
                    class="btn btn-outline-secondary btn-sm me-2"
                    ><i class="bi bi-pencil"></i
                  ></a>
                  <a href="#" class="btn btn-outline-danger btn-sm"
                    ><i class="bi bi-trash"></i
                  ></a>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="text-center">
        <a href="dashboard.html" class="btn btn-outline-info btn-sm"
           style="border-color: var(--accent); color: var(--accent);"
          ><i class="bi bi-arrow-left"></i> Back to Dashboard</a
        >
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
