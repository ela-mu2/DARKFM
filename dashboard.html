<!DOCTYPE html>
<html>
  <head>
    <title>DARKFM - Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.2/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container mx-auto my-5" style="max-width: 800px;">
      <h1 class="h1 mb-4 text-center">Dashboard</h1>
      <div class="row">
        <div class="col-lg-6">
          <div class="card mb-2 card-custom">
            <div class="card-body">
              <h5 class="card-title text-center">
                <div class="mb-1">
                  <i class="bi bi-calendar-week" style="font-size: 3rem;"></i>
                </div>
                Manage Schedule
              </h5>
              <div class="text-center mt-3">
                <a href="manage-schedule.html" class="btn btn-outline-info btn-sm text-white-custom" style="border-color: var(--accent); color: var(--accent);"
                  >Access</a
                >
              </div>
            </div>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="card mb-2 card-custom">
            <div class="card-body">
              <h5 class="card-title text-center">
                <div class="mb-1">
                  <i class="bi bi-mic" style="font-size: 3rem;"></i>
                </div>
                Manage Hosts
              </h5>
              <div class="text-center mt-3">
                <a href="manage-hosts.html" class="btn btn-outline-info btn-sm text-white-custom" style="border-color: var(--accent); color: var(--accent);"
                  >Access</a
                >
              </div>
            </div>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="card mb-2 mt-3 card-custom">
            <div class="card-body">
              <h5 class="card-title text-center">
                <div class="mb-1">
                  <i class="bi bi-collection-play" style="font-size: 3rem;"></i>
                </div>
                Manage Programs
              </h5>
              <div class="text-center mt-3">
                <a href="manage-programs.html" class="btn btn-outline-info btn-sm text-white-custom" style="border-color: var(--accent); color: var(--accent);"
                  >Access</a
                >
              </div>
            </div>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="card mb-2 mt-3 card-custom">
            <div class="card-body">
              <h5 class="card-title text-center">
                <div class="mb-1">
                  <i class="bi bi-person-circle" style="font-size: 3rem;"></i>
                </div>
                Manage Users
              </h5>
              <div class="text-center mt-3">
                <a href="manage-users.html" class="btn btn-outline-info btn-sm text-white-custom" style="border-color: var(--accent); color: var(--accent);"
                  >Access</a
                >
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="mt-4 text-center">
        <a href="index.html" class="btn btn-link btn-sm"
          ><i class="bi bi-arrow-left"></i> Back</a
        >
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
